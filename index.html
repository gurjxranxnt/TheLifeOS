<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE LIFE OS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--text:#f0f2f8;--muted:rgba(240,242,248,.5);--faint:rgba(240,242,248,.25);--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#hub{position:fixed;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;
background:radial-gradient(900px 500px at 15% 0%,rgba(232,52,42,.16),transparent 60%),radial-gradient(900px 500px at 85% 100%,rgba(108,99,255,.18),transparent 60%),var(--bg)}
#hub::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
header{position:relative;text-align:center;margin-bottom:56px;animation:up .8s both}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.35em;color:var(--faint);text-transform:uppercase;margin-bottom:14px}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(56px,11vw,120px);line-height:.95;letter-spacing:.06em;background:linear-gradient(90deg,#f0f2f8 0%,#f5c842 45%,#e8342a 75%,#6c63ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:14px;color:var(--muted);font-size:15px;font-weight:300;letter-spacing:.04em}
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;width:100%;max-width:980px;margin:auto 0}
.card{--c1:#6c63ff;--c2:#38bdf8;position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:340px;padding:32px;border-radius:24px;border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;text-align:left;color:inherit;font:inherit;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;animation:up .8s both}
.card:nth-child(2){animation-delay:.12s}
.card::before{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-120px;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 65%);opacity:.28;transition:opacity .35s,transform .5s}
.card:hover,.card:focus-visible{transform:translateY(-8px);border-color:color-mix(in srgb,var(--c1) 60%,transparent);box-shadow:0 24px 60px -18px var(--c1);outline:none}
.card:hover::before{opacity:.5;transform:scale(1.15)}
.card.war{--c1:#e8342a;--c2:#f5c842}
.tag{position:relative;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--faint)}
.icon{position:relative;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:30px;margin:22px 0;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 30px -8px var(--c1)}
.card h2{position:relative;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:44px;letter-spacing:.06em;line-height:1}
.card.acad h2{font-family:'Syne',sans-serif;font-weight:800;font-size:34px;letter-spacing:.02em}
.card p{position:relative;margin-top:10px;color:var(--muted);font-size:14px;line-height:1.55;font-weight:300;max-width:34ch}
.open{position:relative;margin-top:26px;display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.open span{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));transition:transform .3s}
.card:hover .open span{transform:translateX(6px)}
footer{position:relative;margin-top:44px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
#viewer{position:fixed;inset:0;display:none;background:var(--bg)}
#viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#back{position:fixed;left:10px;bottom:10px;z-index:99999;display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(8,10,18,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#f0f2f8;font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;opacity:.55;transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#back:hover,#back:focus-visible{opacity:1;transform:translateY(-2px);outline:none}
#back .lbl{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s}
#back:hover .lbl,#back:focus-visible .lbl{max-width:120px}

.bk{position:relative;width:100%;max-width:980px;margin-top:28px;padding:22px 26px;border-radius:20px;border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;animation:up .8s .25s both}
.bk h3{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:24px;letter-spacing:.08em}
.bk .st{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--muted);line-height:1.7}
.bk .btns{display:flex;gap:10px;flex-wrap:wrap}
.bbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font:600 12px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.bbtn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
.bbtn.pri{border:0;background:linear-gradient(135deg,#e8342a,#f5c842);color:#07090f;box-shadow:0 10px 26px -10px #e8342a}
#lifeToast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:100000;padding:12px 20px;border-radius:12px;background:rgba(12,15,26,.95);border:1px solid rgba(255,255,255,.18);font-size:13px;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#lifeToast.on{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:600px){#hub{padding:40px 16px 28px}.card{min-height:290px;padding:24px}}
</style>
</head>
<body>

    <div class="eyebrow">Personal Operating System</div>
    <h1>THE LIFE OS</h1>
    <div class="sub">Choose your arena.</div>
  </header>
  <main class="grid">
    <button class="card acad" data-app="acad" aria-label="Open Academic Comeback">
      <div><div class="tag">MODULE 01</div><div class="icon">📚</div>
      <h2>ACADEMIC COMEBACK</h2><p>Your complete CBSE Class X study tracker, syllabus, progress and analytics.</p></div>
      <div class="open">Open <span>→</span></div>

    <button class="card war" data-app="arc" aria-label="Open The Comeback Arc">

      <h2>THE COMEBACK ARC</h2><p>Combat sports and performance dashboard. Train, track and rebuild.</p></div>
      <div class="open">Open <span>→</span></div>
    </button>

      <button class="bbtn" id="bkImport">⬆ Restore Backup</button>
      <input type="file" id="bkFile" accept=".json,application/json" style="display:none">
    </div>
  </section>
  <footer>THE LIFE OS</footer>
</div>

  var name="life-os-backup-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+".json";
  var blob=new Blob([JSON.stringify(pkg,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  sv(K_LAST,d.toLocaleString());refreshStatus();
  toast("Backup downloaded: "+(acad?"Academic ✓ ":"Academic – ")+(arc?"Arc ✓":"Arc –"));
}
function restore(file){
  var r=new FileReader();
  r.onload=function(e){
    var j=pj(e.target.result);
    if(!j||typeof j!=="object"){toast("Restore failed: not a valid JSON file.");return}
    var acad=null,arc=null,arcSave=null,found=[];
    if(j.type==="life-os-backup"&&j.data){
      acad=j.data.academicComeback||null;
      if(j.data.theComebackArc){arc=j.data.theComebackArc.state||null;arcSave=j.data.theComebackArc.lastSave||null}
    }else if(j.chapters&&j.stats){acad=j}          /* old single Academic export */
    else if(j.profile!==undefined&&j.nutrition!==undefined){arc=j} /* old single Arc export */
    else{toast("Restore failed: this is not a Life OS or app backup file.");return}
    if(acad)found.push("ACADEMIC COMEBACK");if(arc)found.push("THE COMEBACK ARC");
    if(!found.length){toast("This backup contains no data.");return}
    if(!confirm("Restore "+found.join(" + ")+"?\n\nThis replaces the current saved data for those apps.\nTip: take a fresh backup first if unsure."))return;
    try{
      if(acad)sv(K_ACAD,JSON.stringify(acad));
      if(arc){sv(K_ARC,JSON.stringify(arc));sv(K_ARCSAVE,arcSave||new Date().toLocaleString())}
      refreshStatus();toast("Restored: "+found.join(" + "));
    }catch(err){toast("Restore failed: "+err.message)}
  };
  r.readAsText(file);
}
document.getElementById("bkExport").addEventListener("click",backup);
document.getElementById("bkImport").addEventListener("click",function(){document.getElementById("bkFile").click()});
document.getElementById("bkFile").addEventListener("change",function(e){if(e.target.files[0])restore(e.target.files[0]);e.target.value=""});
refreshStatus();

</script>
